[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chat-continuity"
version = "0.1.0"
description = "Lossless conversation archives and source-grounded AI handoff checks"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
chat-continuity = "continuity.__main__:main"

[tool.setuptools.packages.find]
include = ["continuity*"]
